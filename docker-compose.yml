version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collab_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: collab_server
    restart: always
    environment:
      PORT: 5000
      WS_PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/collab_db?schema=public
      JWT_SECRET: super_secret_jwt_key_collab_forge_2026_dev_env
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
